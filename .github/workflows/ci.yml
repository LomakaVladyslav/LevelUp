name: CI

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            levelup-backend/package-lock.json
            levelup-mobile/package-lock.json

      - name: Install backend dependencies
        run: npm ci
        working-directory: levelup-backend

      - name: Install mobile dependencies
        run: npm ci --legacy-peer-deps
        working-directory: levelup-mobile

      - name: Run checks
        run: npm run check
