# yaml-language-server: $schema=https://render.com/schema/render.yaml.json

services:
  - type: web
    name: levelup-backend-staging
    runtime: node
    rootDir: levelup-backend
    region: frankfurt
    plan: free
    buildCommand: npm ci --include=dev && npx prisma generate --generator client && npm run build
    preDeployCommand: npx prisma migrate deploy && npx prisma db seed
    startCommand: npm run start
    healthCheckPath: /health
    autoDeployTrigger: commit
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: levelup-postgres-staging
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_MODEL
        value: gpt-5.4-mini
      - key: PASSWORD_RESET_URL_BASE
        sync: false
      - key: PASSWORD_RESET_APP_URL_BASE
        value: levelup://auth/reset-password

databases:
  - name: levelup-postgres-staging
    databaseName: levelup
    user: levelup
    region: frankfurt
    plan: free
    ipAllowList: []
